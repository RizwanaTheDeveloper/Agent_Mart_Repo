# Render Blueprint: backend API (NestJS + Prisma) + managed PostgreSQL.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: agentmart-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    # devDependencies are needed to build (nest CLI, prisma CLI, typescript).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Free plans have no pre-deploy command, so migrations run at start (idempotent).
    startCommand: npx prisma migrate deploy && node dist/main
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentmart-db
          property: connectionString
      # Render terminates TLS and redirects http->https, so the app-level check is unnecessary
      # (and would block Render's internal health probe).
      - key: REQUIRE_HTTPS
        value: false
      - key: SWAGGER_ENABLED
        value: false
      # Set in the dashboard: your deployed web origin(s), comma-separated. Native apps send no Origin.
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_TTL_MINUTES
        value: 120
      - key: ELEVATION_TTL_MINUTES
        value: 10
      - key: PLOT_CODE_REGEX
        value: ^[A-Z0-9]{2,10}(-[A-Z0-9]{1,12}){1,4}$
      - key: SEED_DEMO_DATA
        value: false

databases:
  - name: agentmart-db
    databaseName: agentmart_admin
    user: agentmart
    plan: free
    region: oregon
    # Must be >= the local server (18) so a local pg_dump restores cleanly.
    postgresMajorVersion: "18"
